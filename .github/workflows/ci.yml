name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore VulnerabilityTracker.sln --locked-mode
      - name: Build Release
        run: dotnet build VulnerabilityTracker.sln -c Release --no-restore
      - name: Run MSTest
        run: dotnet test --solution VulnerabilityTracker.sln -c Release --no-build --report-trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mstest-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
